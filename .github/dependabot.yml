version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # These must move together: @axe-core/playwright shares playwright-core.
      playwright:
        patterns: ['@playwright/test', 'playwright-core']
      # Minor and patch updates of everything else in one weekly PR.
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['@playwright/test', 'playwright-core']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
